<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Wi-Fi - WIFI ZONE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f2f5fa;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px 24px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.10);
    }

    h1 {
      color: #102b50;
      font-size: 25px;
    }

    p {
      color: #555;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 15px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 20px;
      text-align: center;
      text-transform: uppercase;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #102b50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>WIFI ZONE</h1>

    <p>Bienvenue sur WIFI ZONE Ngoumba Mabi.</p>
    <p>Entre ton code Wi-Fi pour démarrer ton forfait.</p>

    <input
      type="text"
      id="code"
      maxlength="8"
      placeholder="TON CODE WI-FI"
      autocomplete="off"
    >

    <button onclick="activerCode()">
      SE CONNECTER
    </button>

    <div id="message"></div>
  </div>

  <script>
    async function activerCode() {
      const code = document.getElementById("code").value.trim();
      const message = document.getElementById("message");

      if (!code) {
        message.textContent = "Entre ton code Wi-Fi.";
        return;
      }

      message.textContent = "Vérification du code...";

      try {
        const reponse = await fetch("/api/activer-code", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ code })
        });

        const resultat = await reponse.json();
        message.textContent = resultat.message;

      } catch (erreur) {
        message.textContent = "Impossible de contacter le serveur.";
      }
    }
  </script>

</body>
</html>
